characteristic_curve:
  # ILFORD Delta 400 Professional: fast Core-Shell tabular-grain negative.
  # Normal ID-11 development is intended for a printable normal contrast;
  # preserve its useful EI 200-3200 working range with a gradual toe and
  # shoulder, rather than turning its ISO speed into an aggressive grade.
  # Fast T-grain: gradual gentle shoulder and a moderately open toe over a wide
  # working range; smoother and less punchy than Tri-X.
