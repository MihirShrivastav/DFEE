  shadow_cast_b: -0.20
  highlight_cast_a: 0.15
  highlight_cast_b: 0.22
  exposure_sensitivity: 0.35
characteristic_curve:
  # 800T is C-41 processed at EI 800. Its output has modestly firmer contrast
  # than Vision3 500T, but keeps the high-speed stock's long toe and extended
  # highlight shoulder for night scenes and practical lights.
