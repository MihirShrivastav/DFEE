crossover:
  # CineStill 800T (Vision3 500T minus rem-jet): THE tungsten night look. In daylight it
  # reads cool with shadows going strongly BLUE-GREEN (teal) — even more than 500T — while
  # highlights carry the warm/orange tungsten glow. Blue toe freed above so the curve
  # supports the teal shadows rather than warming them. Highlights kept warm-ORANGE (a
  # moderate, b high) rather than red-magenta. The signature red halation is authored
  # separately in the halation block (strength 0.48, red core) — its rem-jet-removed glow.
  shadow_cast_a: -0.13
  shadow_cast_b: -0.38
  highlight_cast_a: 0.28
  highlight_cast_b: 0.34
  exposure_sensitivity: 0.46
