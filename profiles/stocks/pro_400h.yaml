crossover:
  # Fujicolor Pro 400H: remarkably NEUTRAL, low-contrast, pastel/airy — the opposite of a
  # Kodak warm crossover. Its signature is "green shadows + pink highlights" on a cool base
  # with added depth in blue/green. So: gently green-cyan shadows (a slightly -, b -), and
  # COOL-pastel highlights with only a faint PINK lean (a small +, b kept LOW — NOT the
  # golden/yellow b of Kodak stocks). Subtle overall; the look is softness, not a strong cast.
  shadow_cast_a: -0.04
  shadow_cast_b: -0.14
  highlight_cast_a: 0.07
  highlight_cast_b: 0.06
  exposure_sensitivity: 0.34
