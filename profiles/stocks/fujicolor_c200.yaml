crossover:
  # Fujicolor C200: the budget everyday Fuji. Cooler/subdued vs Kodak but WARMER and softer
  # than Superia — it renders slightly warm greens and its shadows go greenish + milky
  # "warm-gray" (muddy, lifted) rather than Superia's cool moody green. So: greenish shadows
  # (a -), but only faintly cool (b near-neutral, warmer than Superia), and a gentle WARM
  # highlight lean (C200 leans warm) — restrained vs Kodak. Reds stay muted (no red gain).
  shadow_cast_a: -0.05
  shadow_cast_b: -0.08
  highlight_cast_a: 0.08
  highlight_cast_b: 0.18
  exposure_sensitivity: 0.36
