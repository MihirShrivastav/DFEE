  # whites/blues "without the overwhelming magentas". So a restrained, cool-leaning crossover
  # with NO magenta and NO warm highlights: faint cool-neutral shadows, clean near-neutral
  # highlights (whites stay white). The previous +0.05 magenta shadow / -0.45 blue / 0.35
  # warm highlight all contradicted its clean cool-neutral character.
