crossover:
  # Fujicolor Superia X-TRA 400: the "typical Fuji" cool magenta/green look. Its signature
  # is MOODY GREENISH SHADOWS on a punchy, saturated, medium-contrast base (4th cyan layer
  # → cyan/green depth). So: pronounced green + cool shadows (a clearly -, b -), and only a
  # MODEST warm lean in the highlights (from its poppy reds/oranges) — NOT the golden b of
  # the Kodak stocks. Green toe held above so the curve supports the green shadow lean.
  shadow_cast_a: -0.08
  shadow_cast_b: -0.18
  highlight_cast_a: 0.09
  highlight_cast_b: 0.13
  exposure_sensitivity: 0.42
