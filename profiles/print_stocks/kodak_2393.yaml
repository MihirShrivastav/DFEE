print_stock_id: kodak_2393
print_stock_name: Kodak Vision Premier 2393
# Premium discontinued theatrical print stock. Deeper blacks, richer saturation,
# higher contrast than 2383. Often described as "OLED-like" — punchy D-max, vivid
# dyes, and more aggressive compression. Sought after for high-impact theatrical releases.

tone:
  shadow_lift: 0.004          # Clean, deep OLED-like blacks
  contrast_boost: 1.06        # Small global punch on top of the per-channel print curve
  highlight_rolloff: 0.75     # Earlier highlight shoulder — compresses sooner
  highlight_rolloff_rate: 2.6 # Faster rolloff — more dramatic highlight compression
  toe_depth: 0.96             # Extremely rich, deep shadow density
  # Punchier per-channel print curve than 2383: warmer highlights, denser shadows.
  print_toe: 0.34
  print_shoulder: 0.34
  channel_toe_mult: [1.08, 1.0, 0.94]
  channel_shoulder_mult: [1.02, 1.0, 0.90]

color:
  shadow_bias_lab: [0.3, -0.1, -0.5]  # Cool-neutral shadows for print separation/depth
  midtone_bias_lab: [0.0, 0.6, 1.3]   # Vivid warm golden midtones (gentler than before)
  highlight_bias_lab: [0.0, 0.2, 0.8] # Warm highlights
  blue_suppression: 0.05               # Light blue trim (was 0.18)
  red_boost: 0.07                      # Vibrant reds/oranges
  green_shift: 0.03                    # Minimal green-yellow shift
  saturation_scale: 1.12               # Richer, more vivid print dye saturation

grain:
  strength: 0.05              # Minimal print grain
  size: 0.28
