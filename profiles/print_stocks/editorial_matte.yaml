print_stock_id: editorial_matte
print_stock_name: Editorial Matte
# The classic glossy-magazine "matte colour" finish - matte photographic paper has a low
# D-max, so blacks sit as deep grey (open, not crushed), contrast is gentle, highlights are
# creamy, and colour is muted and refined rather than punchy. Not a theatrical print stock;
# an editorial paper-and-finishing look.

tone:
  shadow_lift: 0.035          # Subtle open blacks (deep grey) - matte, but keeps depth
  contrast_boost: 1.08        # Keep real midtone contrast - matte is soft at the EXTREMES, not flat
  highlight_rolloff: 0.86     # Only the very top softens -> gentle creamy shoulder (keeps highlight detail)
  highlight_rolloff_rate: 2.0 # Gentle top-only rolloff (doesn't grey/wash the whole upper range)
  toe_depth: 0.55             # Some shadow anchor so it doesn't float

color:
  shadow_bias_lab: [0.3, -0.2, -0.2]  # Faintly cool, lightly lifted shadows
  midtone_bias_lab: [0.0, 0.2, 0.5]   # Refined, faintly warm midtones (not golden)
  highlight_bias_lab: [0.0, 0.0, 0.3] # Clean highlights
  blue_suppression: 0.0                # Neutral balance - no yellow cast
  red_boost: 0.0
  green_shift: 0.0
  saturation_scale: 0.92               # Muted, refined "matte colour" - the magazine quality

grain:
  strength: 0.04              # Barely-there paper grain
  size: 0.30
